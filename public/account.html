<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Maison Velvet</title>
  <meta name="description" content="Manage your Maison Velvet orders, wishlist and profile.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23161513'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23efe9df' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<main id="main">
  <div class="page container">
    <header class="page-head reveal visible">
      <p class="kicker">My Maison</p>
      <h1 class="page-title">Account</h1>
    </header>

    <div id="account-root" hidden>
      <div class="account-layout">
        <nav class="account-nav" aria-label="Account sections">
          <button type="button" data-tab="orders" class="on">Orders</button>
          <button type="button" data-tab="wishlist">Wishlist</button>
          <button type="button" data-tab="profile">Profile</button>
          <button type="button" id="signout-btn">Sign Out</button>
        </nav>

        <div class="account-content">
          <section class="account-tab" id="tab-orders" aria-label="Your orders">
            <div id="orders-list"></div>
          </section>

          <section class="account-tab" id="tab-wishlist" aria-label="Your wishlist" hidden>
            <div class="account-head-row">
              <p class="shop-meta" id="wish-count-label"></p>
            </div>
            <div class="products-grid" id="wish-grid" style="margin-top:0"></div>
          </section>

          <section class="account-tab" id="tab-profile" aria-label="Profile details" hidden>
            <div class="panel">
              <h2>Profile</h2>
              <div id="profile-body"></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <p class="shop-meta" id="account-loading">Loading your account…</p>
  </div>
</main>

<script src="/js/core.js"></script>
<script src="/js/pages/account.js"></script>
</body>
</html>
