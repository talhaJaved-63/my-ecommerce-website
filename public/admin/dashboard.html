<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Maison Velvet Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23161513'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23efe9df' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="adm-shell" id="adm-root" hidden>
  <aside class="adm-side">
    <div class="adm-brand">
      <a href="/admin/dashboard.html">Maison Velvet<small>Atelier Console</small></a>
    </div>
    <nav class="adm-nav" aria-label="Admin sections">
      <button type="button" data-view="overview" class="on">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Overview
      </button>
      <button type="button" data-view="products">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
        Products
      </button>
      <button type="button" data-view="inventory">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7l8-4 8 4v10l-8 4-8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>
        Inventory
      </button>
      <button type="button" data-view="orders">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4h14v17l-2-1.5L15 21l-2-1.5L11 21l-2-1.5L7 21l-2-1.5V4Z"/><path d="M9 9h6M9 13h6"/></svg>
        Orders
        <span class="nav-badge" id="nav-pending" hidden></span>
      </button>
      <button type="button" data-view="customers">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.4-3.4 4-5 6.5-5s5.1 1.6 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.6c2.9.3 5 2 6 4.4"/></svg>
        Customers
      </button>
    </nav>
    <div class="adm-side-foot">
      <a href="/" target="_blank" rel="noopener">View Store ↗</a>
      <button type="button" id="adm-signout">Sign Out</button>
    </div>
  </aside>

  <div class="adm-main">
    <header class="adm-topbar">
      <h1 id="adm-title">Overview</h1>
      <span class="adm-user" id="adm-user"></span>
    </header>

    <div class="adm-content">

      <!-- OVERVIEW -->
      <section class="adm-view" id="view-overview">
        <p class="skeleton-note">Loading overview…</p>
      </section>

      <!-- PRODUCTS -->
      <section class="adm-view" id="view-products" hidden>
        <div class="toolbar">
          <input type="search" class="input" id="prod-q" placeholder="Search name or SKU…" aria-label="Search products">
          <select class="select" id="prod-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
          <span class="count-note" id="prod-count"></span>
          <span class="spacer"></span>
          <button type="button" class="btn btn-solid" id="prod-add">+ Add Product</button>
        </div>
        <div id="prod-table"><p class="skeleton-note">Loading products…</p></div>
      </section>

      <!-- INVENTORY -->
      <section class="adm-view" id="view-inventory" hidden>
        <div class="toolbar">
          <label class="check-row" style="padding-top:0">
            <input type="checkbox" id="inv-low"> Low stock only (&lt; 6)
          </label>
          <span class="count-note" id="inv-count"></span>
        </div>
        <div id="inv-table"><p class="skeleton-note">Loading inventory…</p></div>
      </section>

      <!-- ORDERS -->
      <section class="adm-view" id="view-orders" hidden>
        <div class="toolbar">
          <input type="search" class="input" id="ord-q" placeholder="Search number, email, name…" aria-label="Search orders">
          <select class="select" id="ord-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option>
          </select>
          <select class="select" id="ord-payment" aria-label="Filter by payment">
            <option value="">All payments</option>
            <option>unpaid</option><option>paid</option><option>failed</option><option>refunded</option>
          </select>
          <span class="count-note" id="ord-count"></span>
        </div>
        <div id="ord-table"><p class="skeleton-note">Loading orders…</p></div>
      </section>

      <!-- CUSTOMERS -->
      <section class="adm-view" id="view-customers" hidden>
        <div class="toolbar">
          <input type="search" class="input" id="cus-q" placeholder="Search customers…" aria-label="Search customers">
          <span class="count-note" id="cus-count"></span>
        </div>
        <div id="cus-table"><p class="skeleton-note">Loading customers…</p></div>
      </section>

    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button type="button" class="modal-x" id="modal-x" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot" hidden></div>
  </div>
</div>

<div class="toast" id="adm-toast" role="status" aria-live="polite"></div>

<script src="/js/admin/admin.js" defer></script>
</body>
</html>
